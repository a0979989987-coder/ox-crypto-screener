<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OX TERMINAL | 智慧行情與量化雷達</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0a0b0e;
      --bg-surface: rgba(18, 20, 26, 0.75);
      --bg-surface-elevated: rgba(26, 29, 38, 0.85);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-focus: rgba(0, 230, 153, 0.5);
      --text-main: #f0f3f6;
      --text-muted: #848e9c;
      --text-dim: #4f5867;
      --accent-ox: #00e699;
      --accent-ox-dim: rgba(0, 230, 153, 0.15);
      --bull: #0ecb81;
      --bear: #f6465d;
      --card-blur: blur(16px);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --shadow-glass: 0 16px 36px rgba(0, 0, 0, 0.45);
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="light"] {
      --bg-base: #f4f6f9;
      --bg-surface: rgba(255, 255, 255, 0.82);
      --bg-surface-elevated: rgba(245, 247, 250, 0.95);
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-border-focus: rgba(0, 184, 122, 0.5);
      --text-main: #14171f;
      --text-muted: #5e6673;
      --text-dim: #9aa0a6;
      --accent-ox: #00b87a;
      --accent-ox-dim: rgba(0, 184, 122, 0.12);
      --bull: #00a86b;
      --bear: #e0354c;
      --shadow-glass: 0 16px 32px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    input, button {
      font-family: inherit;
      border: none;
      outline: none;
    }

    /* Top Nav */
    header.ox-header {
      height: 56px;
      padding: 0 16px;
      background: var(--bg-surface);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 1.5px;
      color: var(--accent-ox);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Symbol Exchange Trigger Pill */
    .symbol-pill-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .symbol-pill-btn:hover {
      border-color: var(--accent-ox);
      box-shadow: 0 0 12px var(--accent-ox-dim);
    }

    .symbol-pill-name {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .symbol-pill-tag {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--accent-ox-dim);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
    }

    .symbol-pill-arrow {
      width: 12px;
      height: 12px;
      stroke: var(--text-muted);
      transition: transform 0.2s;
    }

    /* Toolbar Controls */
    .chart-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .chart-controls::-webkit-scrollbar { display: none; }

    .btn-tf, .btn-tool {
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-tf.active, .btn-tool.active {
      color: var(--text-main);
      background: var(--bg-surface-elevated);
      border: 1px solid var(--glass-border);
    }

    .btn-tool.active {
      color: var(--accent-ox);
      border-color: var(--accent-ox-dim);
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface-elevated);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      border-color: var(--accent-ox);
    }

    /* Main Chart Area */
    .terminal-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .price-bar {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 8px 16px;
      font-family: var(--font-mono);
      background: var(--bg-base);
    }

    .live-price {
      font-size: 24px;
      font-weight: 700;
    }

    .live-price.bull { color: var(--bull); }
    .live-price.bear { color: var(--bear); }

    .price-stats {
      font-size: 12px;
      display: flex;
      gap: 12px;
      color: var(--text-muted);
    }

    .chart-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 180px);
      min-height: 480px;
    }

    canvas#klineCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* OX LIVE Ticker Bar */
    .ox-live-bar {
      height: 36px;
      background: var(--bg-surface);
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 12px;
      gap: 12px;
    }

    .live-pill {
      background: #ff3b30;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      animation: pulseLive 1.5s infinite;
    }

    @keyframes pulseLive {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .ox-live-stream {
      color: var(--text-muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* OX CONTROL Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 998;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .ox-control-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 360px;
      max-width: 90vw;
      height: 100%;
      background: var(--bg-surface-elevated);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border-left: 1px solid var(--glass-border);
      box-shadow: var(--shadow-glass);
      z-index: 999;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .ox-control-drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--glass-border);
    }

    .drawer-header h3 {
      font-size: 16px;
      font-weight: 700;
    }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* [FEATURE 1] OX CONTROL Search Component */
    .feature-search-box {
      position: relative;
      margin-bottom: 8px;
    }

    .feature-search-input-wrap {
      display: flex;
      align-items: center;
      background: var(--bg-base);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      gap: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .feature-search-input-wrap:focus-within {
      border-color: var(--accent-ox);
      box-shadow: 0 0 0 3px var(--accent-ox-dim);
    }

    .feature-search-input {
      background: transparent;
      color: var(--text-main);
      font-size: 13px;
      width: 100%;
    }

    .feature-search-input::placeholder {
      color: var(--text-dim);
    }

    .feature-search-results {
      margin-top: 8px;
      max-height: 280px;
      overflow-y: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: var(--bg-surface);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      display: none;
    }

    .feature-search-results.active {
      display: block;
    }

    .feature-item {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-bottom: 1px solid var(--glass-border);
      transition: background 0.15s;
    }

    .feature-item:last-child {
      border-bottom: none;
    }

    .feature-item:hover {
      background: var(--accent-ox-dim);
    }

    .feature-item-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .feature-item-icon {
      font-size: 16px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-ox);
    }

    .feature-item-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
    }

    .feature-item-cat {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--glass-border);
      color: var(--text-muted);
    }

    .search-no-match {
      padding: 16px;
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
    }

    /* Highlight Pulse Animation for targeted UI element */
    @keyframes oxTargetPulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 230, 153, 0.8); }
      70% { box-shadow: 0 0 0 12px rgba(0, 230, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 230, 153, 0); }
    }

    .ox-highlight-pulse {
      animation: oxTargetPulse 1.2s ease-out 2 !important;
      border-color: var(--accent-ox) !important;
    }

    /* Section Cards in Drawer */
    .control-group {
      background: var(--bg-surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-group-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
      font-weight: 700;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    /* Switch Style */
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
    }

    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--bg-base);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      transition: .3s;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: var(--text-muted);
      border-radius: 50%;
      transition: .3s;
    }

    input:checked + .toggle-slider {
      background-color: var(--accent-ox);
      border-color: var(--accent-ox);
    }

    input:checked + .toggle-slider:before {
      transform: translateX(18px);
      background-color: #0a0b0e;
    }

    /* [FEATURE 2] Exchange Selector (Desktop Popover & Mobile Bottom Sheet) */
    .exchange-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1050;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .exchange-modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Desktop Liquid Glass Popover */
    .exchange-container {
      position: fixed;
      z-index: 1051;
      background: var(--bg-surface-elevated);
      backdrop-filter: var(--card-blur);
      -webkit-backdrop-filter: var(--card-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-glass);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (min-width: 769px) {
      .exchange-container {
        width: 380px;
        top: 64px;
        left: 120px;
        transform: translateY(-8px) scale(0.98);
        opacity: 0;
        pointer-events: none;
      }
      .exchange-container.open {
        transform: translateY(0) scale(1);
        opacity: 1;
        pointer-events: auto;
      }
    }

    /* Mobile Bottom Sheet */
    @media (max-width: 768px) {
      .exchange-container {
        width: 100vw;
        max-width: 100vw;
        left: 0;
        bottom: 0;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        transform: translateY(100%);
        pointer-events: none;
      }
      .exchange-container.open {
        transform: translateY(0);
        pointer-events: auto;
      }
    }

    .sheet-handle-bar {
      display: none;
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--glass-border);
      margin: 10px auto 4px auto;
    }

    @media (max-width: 768px) {
      .sheet-handle-bar { display: block; }
    }

    .exchange-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .exchange-header h4 {
      font-size: 15px;
      font-weight: 700;
    }

    .exchange-list {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 420px;
      overflow-y: auto;
    }

    .exchange-item {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .exchange-item:hover:not(.disabled) {
      border-color: var(--accent-ox);
      background: var(--accent-ox-dim);
    }

    .exchange-item.active {
      border-color: var(--accent-ox);
      background: var(--accent-ox-dim);
      box-shadow: inset 0 0 0 1px var(--accent-ox);
    }

    .exchange-item.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .item-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .item-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .exchange-name {
      font-size: 14px;
      font-weight: 700;
    }

    .contract-badge {
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--bg-base);
      color: var(--text-muted);
    }

    .item-symbol {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .item-metrics {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      font-family: var(--font-mono);
    }

    .item-price {
      font-size: 13px;
      font-weight: 700;
    }

    .item-vol {
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-unavailable {
      font-size: 11px;
      color: var(--bear);
      background: rgba(246, 70, 93, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="ox-header">
    <div class="header-left">
      <div class="brand-logo" id="brandLogo">
        <span>⚡ OX</span>
      </div>

      <!-- [FEATURE 2 Trigger] Radar Symbol & Exchange Trigger Pill -->
      <div class="symbol-pill-btn" id="symbolExchangeTrigger">
        <span class="symbol-pill-name" id="headerSymbolTitle">BTCUSDT 永續合約</span>
        <span class="symbol-pill-tag" id="headerExchangeTag">Bitget</span>
        <svg class="symbol-pill-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>

      <!-- Timeframes -->
      <div class="chart-controls" id="tfSelectorGroup">
        <button class="btn-tf" data-tf="1m">1m</button>
        <button class="btn-tf" data-tf="5m">5m</button>
        <button class="btn-tf active" data-tf="15m">15m</button>
        <button class="btn-tf" data-tf="1h">1h</button>
        <button class="btn-tf" data-tf="4h">4h</button>
        <button class="btn-tf" data-tf="1d">1D</button>
      </div>
    </div>

    <div class="header-right">
      <button class="btn-tool active" id="btnToggleOX">OX 指標</button>
      <button class="btn-tool active" id="btnToggleSwing">前高前低</button>
      <button class="btn-tool active" id="btnToggleVol">VOL</button>
      
      <button class="btn-icon" id="btnThemeToggle" title="切換明暗主題">
        <span id="themeIcon">🌙</span>
      </button>

      <button class="btn-icon" id="btnOxControl" title="開啟 OX CONTROL">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="21" x2="4" y2="14"></line>
          <line x1="4" y1="10" x2="4" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12" y2="3"></line>
          <line x1="20" y1="21" x2="20" y2="16"></line>
          <line x1="20" y1="12" x2="20" y2="3"></line>
          <circle cx="4" cy="12" r="2"></circle>
          <circle cx="12" cy="10" r="2"></circle>
          <circle cx="20" cy="14" r="2"></circle>
        </svg>
      </button>
    </div>
  </header>

  <!-- Live Price Readout -->
  <div class="price-bar">
    <div class="live-price bull" id="liveTickerPrice">--.--</div>
    <div class="price-stats">
      <span>24H 漲跌: <strong id="liveChange24h">--%</strong></span>
      <span>24H 最高: <strong id="liveHigh24h">--</strong></span>
      <span>24H 最低: <strong id="liveLow24h">--</strong></span>
      <span>24H 量: <strong id="liveVol24h">--</strong></span>
    </div>
  </div>

  <!-- Main Chart Canvas -->
  <main class="terminal-container">
    <div class="chart-wrapper" id="chartWrapper">
      <canvas id="klineCanvas"></canvas>
    </div>

    <!-- OX LIVE Stream Bar -->
    <div class="ox-live-bar" id="oxLiveBar">
      <div class="live-pill">OX LIVE</div>
      <div class="ox-live-stream" id="oxLiveStreamText">連線中... 正在監控多交易所即時訂單流與突破信號</div>
    </div>
  </main>

  <!-- [FEATURE 2 POPUP / BOTTOM SHEET] Exchange Switcher Modal -->
  <div class="exchange-modal-backdrop" id="exchangeModalBackdrop"></div>
  <div class="exchange-container" id="exchangeContainer">
    <div class="sheet-handle-bar"></div>
    <div class="exchange-header">
      <h4 id="exchangeModalTitle">BTCUSDT 永續合約 數據源</h4>
      <button class="btn-tf" id="closeExchangeModal">✕</button>
    </div>
    <div class="exchange-list" id="exchangeOptionsList">
      <!-- Injected dynamically based on Live Data Providers -->
    </div>
  </div>

  <!-- [FEATURE 1] OX CONTROL Drawer -->
  <div class="drawer-overlay" id="controlDrawerOverlay"></div>
  <aside class="ox-control-drawer" id="oxControlDrawer">
    <div class="drawer-header">
      <h3>OX CONTROL</h3>
      <button class="btn-tf" id="closeControlDrawer">✕</button>
    </div>

    <div class="drawer-content">
      <!-- Feature Search Bar at the very top -->
      <div class="feature-search-box" id="oxControlSearchBox">
        <div class="feature-search-input-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="feature-search-input" id="featureSearchInput" placeholder="搜尋功能或工具…" autocomplete="off" />
        </div>
        <div class="feature-search-results" id="featureSearchResults"></div>
      </div>

      <!-- Settings & Controls Section -->
      <div class="control-group" id="accountControlGroup">
        <div class="control-group-title">帳號與安全</div>
        <div class="control-row">

    /**
     * [FEATURE 2] DATA ADAPTERS (Bitget, Binance, Bybit)
     * Direct endpoints, strictly no dummy data.
     */
    const DataAdapters = {
      Bitget: {
        id: 'Bitget',
        name: 'Bitget',
        contractType: 'USDT Perpetual',
        async fetchKlines(symbol, interval) {
          const granularityMap = { '1m': '1m', '5m': '5m', '15m': '15m', '1h': '1h', '4h': '4h', '1d': '1Dutc' };
          const gran = granularityMap[interval] || '15m';
          const url = `https://api.bitget.com/api/v2/mix/market/candles?symbol=${symbol}&granularity=${gran}&productType=USDT-FUTURES&limit=150`;
          const res = await fetch(url);
          const json = await res.json();
          if (json.code === '00000' && Array.isArray(json.data)) {
            return json.data.map(item => ({
              time: parseInt(item[0]),
              open: parseFloat(item[1]),
              high: parseFloat(item[2]),
              low: parseFloat(item[3]),
              close: parseFloat(item[4]),
              volume: parseFloat(item[5])
            })).reverse();
          }
          throw new Error('Bitget data unavailable');
        },
        async fetchTicker(symbol) {
          const url = `https://api.bitget.com/api/v2/mix/market/ticker?symbol=${symbol}&productType=USDT-FUTURES`;
          const res = await fetch(url);
          const json = await res.json();
          if (json.code === '00000' && json.data && json.data[0]) {
            const d = json.data[0];
            return {
              price: parseFloat(d.lastPr),
              change24h: parseFloat(d.change24h) * 100,
              high24h: parseFloat(d.high24h),
              low24h: parseFloat(d.low24h),
              vol24h: parseFloat(d.usdtVolume || d.baseVolume)
            };
          }
          throw new Error('Bitget ticker unavailable');
        },
        connectWs(symbol, interval, onTick) {
          const ws = new WebSocket('wss://ws.bitget.com/v2/ws/public');
          ws.onopen = () => {
            const sub = {
              op: 'subscribe',
              args: [{
                instType: 'USDT-FUTURES',
                channel: 'ticker',
                instId: symbol
              }]
            };
            ws.send(JSON.stringify(sub));
          };
          ws.onmessage = (event) => {
            try {
              const msg = JSON.parse(event.data);
              if (msg.action === 'snapshot' || msg.action === 'update') {
                if (msg.data && msg.data[0]) {
                  const tick = msg.data[0];
                  onTick({
                    price: parseFloat(tick.lastPr),
                    change24h: parseFloat(tick.change24h || 0) * 100,
                    high24h: parseFloat(tick.high24h || 0),
                    low24h: parseFloat(tick.low24h || 0),
                    vol24h: parseFloat(tick.usdtVolume || 0)
                  });
                }
              }
            } catch (err) {}
          };
          return ws;
        }
      },

      Binance: {
        id: 'Binance',
        name: 'Binance',
        contractType: 'USDT Perpetual',
        async fetchKlines(symbol, interval) {
          const intervalMap = { '1m': '1m', '5m': '5m', '15m': '15m', '1h': '1h', '4h': '4h', '1d': '1d' };
          const inv = intervalMap[interval] || '15m';
          const url = `https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${inv}&limit=150`;
          const res = await fetch(url);
          const data = await res.json();
          if (Array.isArray(data)) {
            return data.map(item => ({
              time: item[0],
              open: parseFloat(item[1]),
              high: parseFloat(item[2]),
              low: parseFloat(item[3]),
              close: parseFloat(item[4]),
              volume: parseFloat(item[5])
            }));
          }
          throw new Error('Binance data unavailable');
        },
        async fetchTicker(symbol) {
          const url = `https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${symbol}`;
          const res = await fetch(url);
          const d = await res.json();
          if (d.symbol) {
            return {
              price: parseFloat(d.lastPrice),
              change24h: parseFloat(d.priceChangePercent),
              high24h: parseFloat(d.highPrice),
              low24h: parseFloat(d.lowPrice),
              vol24h: parseFloat(d.quoteVolume)
            };
          }
          throw new Error('Binance ticker unavailable');
        },
        connectWs(symbol, interval, onTick) {
          const ws = new WebSocket(`wss://fstream.binance.com/ws/${symbol.toLowerCase()}@ticker`);
          ws.onmessage = (event) => {
            try {
              const d = JSON.parse(event.data);
              onTick({
                price: parseFloat(d.c),
                change24h: parseFloat(d.P),
                high24h: parseFloat(d.h),
                low24h: parseFloat(d.l),
                vol24h: parseFloat(d.q)
              });
            } catch (err) {}
          };
          return ws;
        }
      },

      Bybit: {
        id: 'Bybit',
        name: 'Bybit',
        contractType: 'USDT Perpetual',
        async fetchKlines(symbol, interval) {
          const intervalMap = { '1m': '1', '5m': '5', '15m': '15', '1h': '60', '4h': '240', '1d': 'D' };
          const inv = intervalMap[interval] || '15';
          const url = `https://api.bybit.com/v5/market/kline?category=linear&symbol=${symbol}&interval=${inv}&limit=150`;
          const res = await fetch(url);
          const json = await res.json();
          if (json.retCode === 0 && json.result && Array.isArray(json.result.list)) {
            return json.result.list.map(item => ({
              time: parseInt(item[0]),
              open: parseFloat(item[1]),
              high: parseFloat(item[2]),
              low: parseFloat(item[3]),
              close: parseFloat(item[4]),
              volume: parseFloat(item[5])
            })).reverse();
          }
          throw new Error('Bybit data unavailable');
        },
        async fetchTicker(symbol) {
          const url = `https://api.bybit.com/v5/market/tickers?category=linear&symbol=${symbol}`;
          const res = await fetch(url);
          const json = await res.json();
          if (json.retCode === 0 && json.result && json.result.list && json.result.list[0]) {
            const d = json.result.list[0];
            return {
              price: parseFloat(d.lastPrice),
              change24h: parseFloat(d.price24hPcnt) * 100,
              high24h: parseFloat(d.highPrice24h),
              low24h: parseFloat(d.lowPrice24h),
              vol24h: parseFloat(d.turnover24h)
            };
          }
          throw new Error('Bybit ticker unavailable');
        },
        connectWs(symbol, interval, onTick) {
          const ws = new WebSocket('wss://stream.bybit.com/v5/public/linear');
          ws.onopen = () => {
            const sub = {
              op: 'subscribe',
              args: [`tickers.${symbol}`]
            };
            ws.send(JSON.stringify(sub));
          };
          ws.onmessage = (event) => {
            try {
              const msg = JSON.parse(event.data);
              if (msg.topic === `tickers.${symbol}` && msg.data) {
                const d = msg.data;
                if (d.lastPrice) {
                  onTick({
                    price: parseFloat(d.lastPrice),
                    change24h: parseFloat(d.price24hPcnt || 0) * 100,
                    high24h: parseFloat(d.highPrice24h || 0),
                    low24h: parseFloat(d.lowPrice24h || 0),
                    vol24h: parseFloat(d.turnover24h || 0)
                  });
                }
              }
            } catch (err) {}
          };
          return ws;
        }
      }
    };

    /**
     * INITIALIZATION & LIFECYCLE

    window.addEventListener('DOMContentLoaded', () => {

    /**

    function initTheme() {

        setTheme(AppState.theme === 'dark' ? 'light' : 'dark');
      });
    }

    function setTheme(mode) {
      AppState.theme = mode;
      document.documentElement.setAttribute('data-theme', mode);
      document.getElementById('themeIcon').innerText = mode === 'dark' ? '🌙' : '☀️';
      localStorage.setItem('ox_theme', mode);
      renderChart();
    }

    /**
     * EVENT LISTENERS SETUP
     */
    function initEventListeners() {
      // OX CONTROL Drawer Open / Close
      const drawer = document.getElementById('oxControlDrawer');
      const overlay = document.getElementById('controlDrawerOverlay');

      const exBackdrop = document.getElementById('exchangeModalBackdrop');

      exchangeTrigger.addEventListener('click', openExchangeModal);
      exClose.addEventListener('click', closeExchangeModal);

      // Timeframe buttons
      document.querySelectorAll('.btn-tf[data-tf]').forEach(btn => {

          document.querySelectorAll('.btn-tf[data-tf]').forEach(b => b.classList.remove('active'));

    function toggleOXIndicator() {
      AppState.showOX = !AppState.showOX;
      document.getElementById('btnToggleOX').classList.toggle('active', AppState.showOX);
      document.getElementById('drawerToggleOX').checked = AppState.showOX;

      AppState.showSwingHL = !AppState.showSwingHL;

    function toggleVolume() {
      AppState.showVolume = !AppState.showVolume;

    /**
     * [FEATURE 1] FEATURE SEARCH LOGIC
     */
    function initFeatureSearch() {
      const input = document.getElementById('featureSearchInput');
      const resultsContainer = document.getElementById('featureSearchResults');

      input.addEventListener('input', (e) => {
        const query = e.target.value.trim().toLowerCase();
        if (!query) {
          resultsContainer.classList.remove('active');
          resultsContainer.innerHTML = '';
          return;
        }

        const matches = OXFeatureRegistry.filter(feat => {
          return feat.title.toLowerCase().includes(query) ||
                 feat.category.toLowerCase().includes(query) ||
                 feat.keywords.some(k => k.toLowerCase().includes(query));
        });

        if (matches.length === 0) {
          resultsContainer.innerHTML = '<div class="search-no-match">未找到相符的功能或工具</div>';
        } else {
          resultsContainer.innerHTML = matches.map(item => `
            <div class="feature-item" data-id="${item.id}">
              <div class="feature-item-main">
                <span class="feature-item-icon">${item.icon}</span>
                <span class="feature-item-title">${item.title}</span>
              </div>
              <span class="feature-item-cat">${item.category}</span>
            </div>
          `).join('');

          // Bind clicks on search result items
          resultsContainer.querySelectorAll('.feature-item').forEach(el => {
            el.addEventListener('click', () => {
              const id = el.getAttribute('data-id');
              const feat = OXFeatureRegistry.find(f => f.id === id);
              if (feat) {
                // 1. Close OX Control drawer
                document.getElementById('oxControlDrawer').classList.remove('open');
                document.getElementById('controlDrawerOverlay').classList.remove('open');
                input.value = '';
                resultsContainer.classList.remove('active');

                // 2. Perform action
                if (typeof feat.action === 'function') {
                  feat.action();
                }

                // 3. Highlight target element briefly
                if (feat.target) {
                  const targetEl = document.querySelector(feat.target);
                  if (targetEl) {
                    targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    targetEl.classList.remove('ox-highlight-pulse');
                    void targetEl.offsetWidth; // trigger reflow
                    targetEl.classList.add('ox-highlight-pulse');
                    setTimeout(() => targetEl.classList.remove('ox-highlight-pulse'), 2500);
                  }
                }
              }
            });
          });
        }
        resultsContainer.classList.add('active');
      });
    }

    /**
     * [FEATURE 2] EXCHANGE SWITCHER (POPOVER / BOTTOM SHEET)
     */
    async function openExchangeModal() {
      const modal = document.getElementById('exchangeContainer');
      const backdrop = document.getElementById('exchangeModalBackdrop');
      const listEl = document.getElementById('exchangeOptionsList');

      modal.classList.add('open');
      backdrop.classList.add('open');

      listEl.innerHTML = '<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:12px;">查詢各交易所即時報價中...</div>';

      const exchanges = [DataAdapters.Bitget, DataAdapters.Binance, DataAdapters.Bybit];
      const results = await Promise.allSettled(
        exchanges.map(ex => ex.fetchTicker(AppState.currentSymbol))
      );

      listEl.innerHTML = '';

      exchanges.forEach((ex, idx) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'exchange-item';
        if (ex.id === AppState.currentExchange) {
          itemEl.classList.add('active');
        }

        const res = results[idx];
        const isAvailable = res.status === 'fulfilled';
        const ticker = isAvailable ? res.value : null;

        if (!isAvailable) {
          itemEl.classList.add('disabled');
        }

        itemEl.innerHTML = `
          <div class="item-meta">
            <div class="item-title-row">
              <span class="exchange-name">${ex.name}</span>
              <span class="contract-badge">${ex.contractType}</span>
            </div>
            <span class="item-symbol">${AppState.currentSymbol}</span>
          </div>
          <div class="item-metrics">
            ${isAvailable ? `
              <span class="item-price" style="color: ${ticker.change24h >= 0 ? 'var(--bull)' : 'var(--bear)'}">                 $${ticker.price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
              </span>
              <span class="item-vol">24H Vol: ${(ticker.vol24h / 1e6).toFixed(2)}M</span>
            ` : `
              <span class="status-unavailable">unavailable</span>
            `}
          </div>
        `;

        if (isAvailable) {
          itemEl.addEventListener('click', () => {
            selectExchange(ex.id);
            closeExchangeModal();
          });
        }

        listEl.appendChild(itemEl);
      });
    }

    function closeExchangeModal() {
      document.getElementById('exchangeContainer').classList.remove('open');
      document.getElementById('exchangeModalBackdrop').classList.remove('open');
    }

    function selectExchange(exchangeId) {
      if (AppState.currentExchange === exchangeId) return;
      AppState.currentExchange = exchangeId;
      document.getElementById('headerExchangeTag').innerText = exchangeId;
      loadMarketData(exchangeId);
    }

    /**
     * CORE DATA FETCHER & WS DISPATCHER
     */
    async function loadMarketData(exchangeId) {
      const adapter = DataAdapters[exchangeId];
      if (!adapter) return;

      document.getElementById('oxLiveStreamText').innerText = `正在切換並加載 ${exchangeId} ${AppState.currentSymbol} 實時合約數據...`;

      // 1. Close previous WebSocket
      if (AppState.activeWs) {
        AppState.activeWs.close();
        AppState.activeWs = null;
      }

      try {
        // 2. Load Klines and initial Ticker in parallel
        const [klines, ticker] = await Promise.all([
          adapter.fetchKlines(AppState.currentSymbol, AppState.currentInterval),
          adapter.fetchTicker(AppState.currentSymbol)
        ]);

        AppState.klines = klines;
        updateTickerUI(ticker);
        calculateSwingHL();
        renderChart();

        // 3. Connect real-time WS
        AppState.activeWs = adapter.connectWs(AppState.currentSymbol, AppState.currentInterval, (tick) => {
          updateTickerUI(tick);
          if (AppState.klines.length > 0) {
            const lastBar = AppState.klines[AppState.klines.length - 1];
            lastBar.close = tick.price;
            if (tick.price > lastBar.high) lastBar.high = tick.price;
            if (tick.price < lastBar.low) lastBar.low = tick.price;
            calculateSwingHL();
            renderChart();
          }
        });

        document.getElementById('oxLiveStreamText').innerText = `已連接 ${exchangeId} 實時流。多空信號與前高前低水平監控運作中。`;
      } catch (err) {
        document.getElementById('oxLiveStreamText').innerText = `數據載入失敗: ${err.message}`;
      }
    }

    function updateTickerUI(ticker) {
      AppState.ticker = ticker;
      const priceEl = document.getElementById('liveTickerPrice');
      const changeEl = document.getElementById('liveChange24h');
      const highEl = document.getElementById('liveHigh24h');
      const lowEl = document.getElementById('liveLow24h');
      const volEl = document.getElementById('liveVol24h');

      priceEl.innerText = '$' + ticker.price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      priceEl.className = 'live-price ' + (ticker.change24h >= 0 ? 'bull' : 'bear');

      changeEl.innerText = (ticker.change24h >= 0 ? '+' : '') + ticker.change24h.toFixed(2) + '%';
      changeEl.style.color = ticker.change24h >= 0 ? 'var(--bull)' : 'var(--bear)';

      highEl.innerText = '$' + ticker.high24h.toLocaleString();
      lowEl.innerText = '$' + ticker.low24h.toLocaleString();
      volEl.innerText = (ticker.vol24h / 1e6).toFixed(2) + 'M';
    }

    /**
     * SWING HIGH / LOW CALCULATION (前高前低)
     */
    function calculateSwingHL() {
      if (AppState.klines.length < 10) return;
      const lookback = 30;
      const recent = AppState.klines.slice(-lookback);
      let maxH = -Infinity;
      let minL = Infinity;
      recent.forEach(b => {
        if (b.high > maxH) maxH = b.high;
        if (b.low < minL) minL = b.low;
      });
      AppState.swingLevels.high = maxH;
      AppState.swingLevels.low = minL;
    }

    /**
     * CHART CANVAS RENDERING ENGINE
     * Preserves Volume, OX Indicator, Swing H/L
     */
    let canvas, ctx;

    function initChartCanvas() {
      canvas = document.getElementById('klineCanvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();
      window.addEventListener('resize', () => {
        resizeCanvas();
        renderChart();
      });
    }

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }

    function renderChart() {
      if (!canvas || !ctx || AppState.klines.length === 0) return;

      const rect = canvas.parentElement.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;

      ctx.clearRect(0, 0, width, height);

      const isDark = AppState.theme === 'dark';
      const klines = AppState.klines;
      const visibleBars = Math.min(80, klines.length);
      const dataSlice = klines.slice(-visibleBars);

      // Bounds
      let minPrice = Infinity;
      let maxPrice = -Infinity;
      let maxVol = 0;

      dataSlice.forEach(b => {
        if (b.low < minPrice) minPrice = b.low;
        if (b.high > maxPrice) maxPrice = b.high;
        if (b.volume > maxVol) maxVol = b.volume;
      });

      const pad = (maxPrice - minPrice) * 0.08 || 1;
      minPrice -= pad;
      maxPrice += pad;

      const chartHeight = AppState.showVolume ? height * 0.76 : height * 0.92;
      const volTop = chartHeight + 10;
      const volHeight = height - volTop - 15;

      const barWidth = (width - 70) / visibleBars;

      // Price to Y mapping
      const getY = (price) => chartHeight - ((price - minPrice) / (maxPrice - minPrice)) * chartHeight;

      // Draw Grid Lines
      ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';
      ctx.lineWidth = 1;
      for (let i = 1; i <= 4; i++) {
        const gridY = (chartHeight / 5) * i;
        ctx.beginPath();
        ctx.moveTo(0, gridY);
        ctx.lineTo(width - 60, gridY);
        ctx.stroke();

        const gridPrice = maxPrice - ((maxPrice - minPrice) / 5) * i;
        ctx.fillStyle = isDark ? '#4f5867' : '#9aa0a6';
        ctx.font = '10px JetBrains Mono';
        ctx.fillText(gridPrice.toFixed(1), width - 55, gridY + 3);
      }

      // 1. Draw Candlesticks
      dataSlice.forEach((bar, idx) => {
        const x = idx * barWidth + barWidth * 0.5;
        const isUp = bar.close >= bar.open;
        const color = isUp ? (isDark ? '#0ecb81' : '#00a86b') : (isDark ? '#f6465d' : '#e0354c');

        // Wick
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(x, getY(bar.high));
        ctx.lineTo(x, getY(bar.low));
        ctx.stroke();

        // Body
        const openY = getY(bar.open);
        const closeY = getY(bar.close);
        const candleTop = Math.min(openY, closeY);
        const candleHeight = Math.max(Math.abs(closeY - openY), 2);

        ctx.fillStyle = color;
        ctx.fillRect(x - barWidth * 0.35, candleTop, barWidth * 0.7, candleHeight);

        // 2. Draw Volume Bars (if ON)
        if (AppState.showVolume && maxVol > 0) {
          const vH = (bar.volume / maxVol) * volHeight;
          ctx.fillStyle = isUp ? 'rgba(14, 203, 129, 0.25)' : 'rgba(246, 70, 93, 0.25)';
          ctx.fillRect(x - barWidth * 0.35, height - vH - 5, barWidth * 0.7, vH);
        }
      });

      // 3. Draw Swing High / Low Lines (if ON)
      if (AppState.showSwingHL && AppState.swingLevels.high > 0) {
        // Swing High
        const shY = getY(AppState.swingLevels.high);
        ctx.strokeStyle = 'rgba(246, 70, 93, 0.85)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(0, shY);
        ctx.lineTo(width - 60, shY);
        ctx.stroke();

        ctx.fillStyle = 'rgba(246, 70, 93, 0.9)';
        ctx.font = '10px Inter';
        ctx.fillText('前高 (Swing H): $' + AppState.swingLevels.high.toFixed(1), 10, shY - 4);

        // Swing Low
        const slY = getY(AppState.swingLevels.low);
        ctx.strokeStyle = 'rgba(14, 203, 129, 0.85)';
        ctx.beginPath();
        ctx.moveTo(0, slY);
        ctx.lineTo(width - 60, slY);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = 'rgba(14, 203, 129, 0.9)';
        ctx.font = '10px Inter';
        ctx.fillText('前低 (Swing L): $' + AppState.swingLevels.low.toFixed(1), 10, slY + 12);
      }

      // 4. Draw OX Patent Trend Indicator (EMA / Ribbon + Signals)
      if (AppState.showOX && dataSlice.length > 5) {
        ctx.strokeStyle = '#00e699';
        ctx.lineWidth = 2.2;
        ctx.beginPath();

        // Calculate simple trend line for OX visualization
        dataSlice.forEach((bar, idx) => {
          const x = idx * barWidth + barWidth * 0.5;
          const trendVal = (bar.open + bar.close + bar.high + bar.low) / 4;
          const y = getY(trendVal);
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        // Target T1/T2/T3 indicators
        const lastBar = dataSlice[dataSlice.length - 1];
        const lastX = (dataSlice.length - 1) * barWidth + barWidth * 0.5;
        const lastY = getY(lastBar.close);

        ctx.fillStyle = '#00e699';
        ctx.font = 'bold 11px Inter';
        ctx.fillText('⚡ OX T1 TARGET', lastX - 90, Math.max(lastY - 24, 20));
      }
    }
  </script>
</body>
