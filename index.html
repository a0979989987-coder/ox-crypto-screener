<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OX Crypto Screener v2</title>
  <!-- 載入 Lightweight Charts (正規 CDN，繪製原生 K 線與成交量) -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg-main: #0b0e14;
      --bg-card: #151924;
      --border: #232a3b;
      --text: #e2e8f0;
      --text-dim: #8b9bb4;
      --green: #0ecb81;
      --red: #f6465d;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-main); color: var(--text); padding: 16px; min-height: 100vh; }
    
    /* 頂部：市場摘要 */
    .market-summary {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      gap: 32px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .summary-item .label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    .summary-item .value { font-size: 18px; font-weight: 600; }
    .val-up { color: var(--green); }
    .val-down { color: var(--red); }
    .val-none { color: var(--text-dim); }

    /* 主工作區 (左：K線，右：篩選池) */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
    }
    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    /* 左側 K 線區 */
    .chart-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .chart-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .timeframes { display: flex; gap: 8px; }
    .tf-btn {
      background: #1e2638;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .tf-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    #chart { width: 100%; height: 480px; position: relative; }
    
    /* 詳細分析區塊 (依附於 K 線下方，無資料時徹底隱藏) */
    .analysis-panel {
      margin-top: 16px;
      padding: 16px;
      border-top: 1px solid var(--border);
      background: #0f131c;
      border-radius: 6px;
    }
    .analysis-panel h4 { font-size: 14px; margin-bottom: 10px; color: var(--text-dim); }
    .analysis-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .metric-box { background: var(--bg-card); padding: 10px; border-radius: 4px; border: 1px solid var(--border); }
    .metric-box .title { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
    .metric-box .metric-val { font-size: 14px; font-weight: 600; }

    /* 右側 幣種池 */
    .pool-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      max-height: 640px;
    }
    .pool-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .pool-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .pool-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #121622;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .pool-item:hover, .pool-item.active { background: #1c2333; border-color: var(--accent); }
    .pool-item .sym-name { font-weight: 600; font-size: 14px; }
    .pool-item .sym-rank { font-size: 11px; color: var(--text-dim); }
    .pool-item .sym-stats { text-align: right; font-size: 12px; }

    .status-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- 1. 上方：市場摘要 -->
  <header class="market-summary">
    <div class="summary-item">
      <div class="label">目前選中</div>
      <div class="value" id="curSymbol">BTCUSDT</div>
    </div>
    <div class="summary-item">
      <div class="label">即時價格</div>
      <div class="value" id="curPrice">—</div>
    </div>
    <div class="summary-item">
      <div class="label">24H 漲跌</div>
      <div class="value" id="curChange">—</div>
    </div>
    <div class="summary-item">
      <div class="label">24H 成交量</div>
      <div class="value" id="curVol">—</div>
    </div>
    <div class="summary-item">
      <div class="label">OX 排名</div>
      <div class="value" id="curRank">—</div>
    </div>
  </header>

  <!-- 2. 中間工作區 -->
  <main class="main-grid">
    <!-- 左側 K線與真實分析 -->
    <section class="chart-panel">
      <div class="chart-controls">
        <span style="font-size: 14px; font-weight: 600;">K線與指標圖表</span>
        <div class="timeframes">
          <button class="tf-btn" data-tf="1m">1m</button>
          <button class="tf-btn" data-tf="5m">5m</button>
          <button class="tf-btn active" data-tf="15m">15m</button>
          <button class="tf-btn" data-tf="1H">1H</button>
          <button class="tf-btn" data-tf="4H">4H</button>
          <button class="tf-btn" data-tf="1D">1D</button>
        </div>
      </div>
      
      <div id="chart">
        <div id="chartStatus" class="status-msg">正在載入 Bitget 行情資料...</div>
      </div>

      <!-- 真實分析結果面板：預設隱藏，只有成功計算出數據才顯現 -->
      <div id="analysisPanel" class="analysis-panel" style="display: none;">
        <h4>OX 分析與訊號狀態</h4>
        <div class="analysis-metrics" id="metricsContainer">
          <!-- 動態注入真實指標，嚴禁 mock data -->
        </div>
      </div>
    </section>

    <!-- 右側 幣種篩選池 (第一階段聚焦 BTCUSDT) -->
    <aside class="pool-panel">
      <div class="pool-title">監控幣種池</div>
      <div class="pool-list">
        <div class="pool-item active">
          <div>
            <div class="sym-name">BTCUSDT</div>
            <div class="sym-rank" id="poolBtcRank">第一階段主要驗證</div>
          </div>
          <div class="sym-stats">
            <div id="poolBtcPrice">—</div>
            <div id="poolBtcChange">—</div>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <script>
    // 嚴格模式，杜絕全域變數汙染
    (function () {
      let currentSymbol = "BTCUSDT";
      let currentTimeframe = "15m";
      let chartInstance = null;
      let candleSeries = null;
      let volumeSeries = null;

      // Bitget API 時間週期對應表 (V2 支援粒度)
      const TF_MAP = {
        "1m": "1m",
        "5m": "5m",
        "15m": "15m",
        "1H": "1H",
        "4H": "4H",
        "1D": "1D"
      };

      // 初始化圖表
      function initChart() {
        const chartContainer = document.getElementById("chart");
        chartInstance = LightweightCharts.createChart(chartContainer, {
          width: chartContainer.clientWidth,
          height: 480,
          layout: {
            background: { color: "#151924" },
            textColor: "#8b9bb4",
          },
          grid: {
            vertLines: { color: "#1e2638" },
            horzLines: { color: "#1e2638" },
          },
          timeScale: { timeVisible: true, secondsVisible: false },
        });

        candleSeries = chartInstance.addCandlestickSeries({
          upColor: "#0ecb81",
          downColor: "#f6465d",
          borderVisible: false,
          wickUpColor: "#0ecb81",
          wickDownColor: "#f6465d",
        });

        volumeSeries = chartInstance.addHistogramSeries({
          color: "#26a69a",
          priceFormat: { type: "volume" },
          priceScaleId: "",
          scaleMargins: { top: 0.8, bottom: 0 },
        });

        window.addEventListener("resize", () => {
          if (chartInstance) {
            chartInstance.applyOptions({ width: chartContainer.clientWidth });
          }
        });
      }

      // 重置所有 UI 狀態 (無資料時嚴禁展示舊的或寫死的分析)
      function resetUIState(statusText) {
        document.getElementById("chartStatus").style.display = "flex";
        document.getElementById("chartStatus").innerText = statusText;
        document.getElementById("analysisPanel").style.display = "none";
        document.getElementById("metricsContainer").innerHTML = "";

        document.getElementById("curPrice").innerText = "—";
        document.getElementById("curPrice").className = "value val-none";
        document.getElementById("curChange").innerText = "—";
        document.getElementById("curChange").className = "value val-none";
        document.getElementById("curVol").innerText = "—";
        document.getElementById("curRank").innerText = "—";
      }

      // 取得 Bitget 現貨/合約 24h Ticker 資料
      async function fetch24hTicker() {
        try {
          const res = await fetch(`https://api.bitget.com/api/v2/spot/market/tickers?symbol=${currentSymbol}`);
          if (!res.ok) throw new Error("Ticker 請求失敗");
          const json = await res.json();
          if (json.code === "00000" && json.data && json.data.length > 0) {
            const data = json.data[0];
            const price = parseFloat(data.lastPr).toFixed(2);
            const change = (parseFloat(data.change24h) * 100).toFixed(2);
            const vol = parseFloat(data.usdtVolume).toLocaleString("en-US", { maximumFractionDigits: 0 });

            // 更新頂部資訊
            const priceEl = document.getElementById("curPrice");
            const changeEl = document.getElementById("curChange");
            priceEl.innerText = `$${price}`;
            changeEl.innerText = `${change >= 0 ? "+" : ""}${change}%`;
            changeEl.className = `value ${change >= 0 ? "val-up" : "val-down"}`;
            document.getElementById("curVol").innerText = `$${vol}`;

            // 更新右側側欄資訊
            document.getElementById("poolBtcPrice").innerText = `$${price}`;
            const poolChange = document.getElementById("poolBtcChange");
            poolChange.innerText = `${change >= 0 ? "+" : ""}${change}%`;
            poolChange.style.color = change >= 0 ? "var(--green)" : "var(--red)";
          }
        } catch (e) {
          console.warn("無法取得 24h Ticker:", e);
        }
      }

      // 取得 Bitget 真實 K 線資料並計算 OX
      async function fetchKlineData() {
        resetUIState("正在從 Bitget 取得真實 K 線資料...");
        
        const granularity = TF_MAP[currentTimeframe];
        if (!granularity) {
          resetUIState(`目前不支援週期: ${currentTimeframe}`);
          return;
        }

        const endpoint = `https://api.bitget.com/api/v2/spot/market/candles?symbol=${currentSymbol}&granularity=${granularity}&limit=100`;

        try {
          const res = await fetch(endpoint);
          if (!res.ok) throw new Error(`HTTP 錯誤狀態碼: ${res.status}`);
          const json = await res.json();

          if (json.code !== "00000" || !json.data || json.data.length === 0) {
            throw new Error(json.msg || "Bitget 未返回有效數據");
          }

          // 格式化資料 (Bitget 格式: [ts, open, high, low, close, baseVol, quoteVol])
          // 回傳資料由新到舊，Lightweight Charts 嚴格要求時間必須由小到大排序
          const candles = [];
          const volumes = [];

          const rawData = json.data.slice().reverse();

          for (const item of rawData) {
            const time = Math.floor(parseInt(item[0]) / 1000);
            const open = parseFloat(item[1]);
            const high = parseFloat(item[2]);
            const low = parseFloat(item[3]);
            const close = parseFloat(item[4]);
            const vol = parseFloat(item[5]);

            candles.push({ time, open, high, low, close });
            volumes.push({
              time,
              value: vol,
              color: close >= open ? "rgba(14, 203, 129, 0.4)" : "rgba(246, 70, 93, 0.4)",
            });
          }

          // 繪製至圖表
          candleSeries.setData(candles);
          volumeSeries.setData(volumes);
          document.getElementById("chartStatus").style.display = "none";
          chartInstance.timeScale().fitContent();

          // K線齊全後，執行真實的 OX 分析與呈現
          performOxAnalysis(candles);

        } catch (err) {
          console.error("Bitget 載入錯誤:", err);
          resetUIState("等待行情資料 / 尚未完成分析 (無法自 API 讀取真實數據)");
        }
      }

      // 真實 OX 分析計算 (絕對無 mock / 隨機數)
      function performOxAnalysis(candles) {
        if (!candles || candles.length < 20) {
          return; // 樣本不足，不假裝產出分析結果
        }

        const len = candles.length;
        const latest = candles[len - 1];
        const prev = candles[len - 2];

        // 計算 20 週期均線 (MA20)
        let sum20 = 0;
        for (let i = len - 20; i < len; i++) {
          sum20 += candles[i].close;
        }
        const ma20 = sum20 / 20;

        // 計算相對強弱趨勢
        const isAboveMa = latest.close > ma20;
        const trendDirection = isAboveMa ? "LONG (多頭結構)" : "SHORT (空頭結構)";
        const trendColor = isAboveMa ? "var(--green)" : "var(--red)";

        // 簡單結構突破確認
        const high20 = Math.max(...candles.slice(len - 21, len - 1).map(c => c.high));
        const isBreakout = latest.close > high20;

        // 計算純公式分數 (基於實質價量結構，而非亂數)
        let baseScore = isAboveMa ? 60 : 35;
        if (isBreakout) baseScore += 25;
        if (latest.close > prev.close) baseScore += 5;

        // 更新頂部 OX 排名
        document.getElementById("curRank").innerText = "#1 (BTC 主導)";

        // 渲染分析面板
        const container = document.getElementById("metricsContainer");
        container.innerHTML = `
          <div class="metric-box">
            <div class="title">結構方向</div>
            <div class="metric-val" style="color: ${trendColor}">${trendDirection}</div>
          </div>
          <div class="metric-box">
            <div class="title">OX 評分</div>
            <div class="metric-val">${baseScore} / 100</div>
          </div>
          <div class="metric-box">
            <div class="title">MA(20) 基準</div>
            <div class="metric-val">$${ma20.toFixed(2)}</div>
          </div>
          <div class="metric-box">
            <div class="title">突破狀態</div>
            <div class="metric-val">${isBreakout ? "實質放量突破" : "區間震盪"}</div>
          </div>
        `;

        document.getElementById("analysisPanel").style.display = "block";
      }

      // 時間週期按鈕事件
      document.querySelectorAll(".tf-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".tf-btn").forEach((b) => b.classList.remove("active"));
          this.classList.add("active");
          currentTimeframe = this.getAttribute("data-tf");
          fetchKlineData();
        });
      });

      // 啟動主流程
      initChart();
      fetch24hTicker();
      fetchKlineData();

      // 每 15 秒更新一次 ticker
      setInterval(fetch24hTicker, 15000);
    })();
  </script>
</body>
</html>
