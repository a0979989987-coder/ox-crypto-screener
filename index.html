<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="OX Crypto Screener - Bitget USDT 永續合約全市場強弱掃描、流動性評估、多型態辨識與專業 K 線工作區。">
  <title>OX 幣種篩選器｜Bitget 全市場資金結構儀表板</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #080c14;
      --panel: #0f1724;
      --panel-alt: #141e2e;
      --ink: #eef4fc;
      --line: #223147;
      --muted: #8b9db7;
      --gold: #f7bd52;
      --gold-dim: #f7bd521f;
      --blue: #5ca5ff;
      --purple: #ad7cff;
      --green: #38c99b;
      --green-dim: #38c99b1a;
      --red: #ee617c;
      --red-dim: #ee617c1a;
      --tier-t1: #f7bd52;
      --tier-t2: #5ca5ff;
      --tier-t3: #ad7cff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: radial-gradient(1200px 500px at 15% -10%, #1c2b4535, transparent), var(--bg);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    a { color: inherit; }
    .wrap { max-width: 1460px; margin: auto; padding: 0 24px; }
    header { border-bottom: 1px solid var(--line); background: #0a101b; position: sticky; top: 0; z-index: 10; }
    .nav { height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; font-weight: 750; font-size: 19px; }
    .brand-logo { width: 38px; height: 38px; object-fit: contain; filter: invert(1); mix-blend-mode: screen; }
    .nav-stats { display: flex; gap: 18px; align-items: center; font-size: 13px; color: var(--muted); }
    .live { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: inline-block; }
    
    /* Global Info Banner */
    .top-summary {
      display: grid;
      grid-template-columns: 1.4fr repeat(4, 1fr);
      gap: 12px;
      margin: 18px 0 20px;
    }
    .metric-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 18px;
    }
    .metric-card label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .metric-card strong { font-size: 24px; font-variant-numeric: tabular-nums; display: block; }
    .metric-card small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
    .positive { color: var(--green) !important; }
    .negative { color: var(--red) !important; }

    /* Workspace Layout: 72% Chart / 28% Scanner */
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 20px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }
    .panel-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #0d1522;
    }
    .panel-title { font-size: 16px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
    .pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #111a28;
      color: var(--muted);
    }

    /* Chart Workstation */
    .chart-box { position: relative; }
    .chart-hud {
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      background: #0b121e;
    }
    .hud-meta { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .hud-meta .symbol-name { font-size: 18px; font-weight: 800; color: var(--ink); }
    .hud-meta .hud-price { font-size: 18px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .badge-t1 { background: #f7bd5226; color: var(--gold); border: 1px solid #f7bd5255; }
    .badge-t2 { background: #5ca5ff26; color: var(--blue); border: 1px solid #5ca5ff55; }
    .badge-t3 { background: #ad7cff26; color: var(--purple); border: 1px solid #ad7cff55; }
    .badge-surge { background: #ff708826; color: var(--red); border: 1px solid #ff708855; }

    .chart-controls {
      padding: 8px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      background: #0d1420;
    }
    .ctrl-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .btn-tf, .btn-act {
      background: #111a28;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 600;
    }
    .btn-tf:hover, .btn-act:hover { color: var(--ink); border-color: #3b506e; }
    .btn-tf.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
    .toggle-lbl {
      font-size: 11px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
    }
    .toggle-lbl input { accent-color: var(--gold); margin: 0; }

    .chart-container {
      height: 600px;
      background: #090e17;
      position: relative;
    }
    .chart-loading-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
      background: #0d1522dd;
      border: 1px solid var(--line);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
      align-items: center;
      gap: 6px;
    }
    .chart-loading-overlay.show { display: flex; }
    .price-timer {
      position: absolute;
      right: 3px;
      z-index: 4;
      transform: translateY(-50%);
      pointer-events: none;
      min-width: 84px;
      padding: 3px 6px;
      border-radius: 3px;
      background: #06090e;

    }
    .price-timer small { display: block; color: var(--gold); font-size: 10px; margin-top: 1px; }

    /* Screener Tabs & Table */
    .scanner-tabs {
      display: flex;
      gap: 4px;
      padding: 10px 14px 6px;
      border-bottom: 1px solid var(--line);
      background: #0b111c;
      overflow-x: auto;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      padding: 6px 11px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;

    .tab-btn:hover { color: var(--ink); }
    .tab-btn.active { background: var(--panel-alt); color: var(--gold); border-color: #3b4e69; }
    .tab-badge { font-size: 10px; padding: 1px 5px; border-radius: 10px; background: #23354d; color: #fff; margin-left: 4px; }

    .scanner-body {
      max-height: 680px;
      overflow-y: auto;
      padding: 6px 0;
    }
    .coin-card {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      color: var(--ink);
      padding: 10px 14px;
      border-bottom: 1px solid #1a2638;
      transition: background .15s;
    }
    .coin-card:hover { background: #152235; }
    .coin-card.selected { background: #f7bd520d; box-shadow: inset 3px 0 0 var(--gold); }
    .coin-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .coin-title { display: flex; align-items: center; gap: 7px; font-weight: 750; font-size: 14px; }
    .coin-ox { font-size: 12px; font-weight: 700; color: var(--gold); }
    .coin-mid { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .coin-reason {
      font-size: 11px;
      color: var(--muted);
      background: #0a1019;
      border-radius: 4px;
      padding: 5px 8px;
      line-height: 1.4;
      border-left: 2px solid #2e435f;
    }
    .score-pills { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
    .score-pill { font-size: 10px; padding: 1px 5px; border-radius: 4px; background: #182436; color: #a5b7ce; }

    /* Traditional Gainers/Losers Rows */
    .trad-row {
      display: grid;
      grid-template-columns: 28px 1.4fr 1fr 1fr;
      align-items: center;
      padding: 9px 14px;
      font-size: 12px;
      border-bottom: 1px solid #1a2638;
      cursor: pointer;
    }
    .trad-row:hover, .trad-row.selected { background: #152235; }

    /* Footer & Tools */
    .extra-section { margin-top: 24px; }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: 360px;
      background: #142032;
      border: 1px solid #364e6f;
      border-left: 4px solid var(--gold);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 10px 30px #000a;
      transform: translateY(120%);
      transition: transform .25s;
      z-index: 100;
      font-size: 13px;
    }
    .toast.show { transform: translateY(0); }

    /* RWD */
    @media (max-width: 1100px) {
      .workspace { grid-template-columns: 1fr; }
      .chart-container { height: 480px; }
      .scanner-body { max-height: 450px; }
    }
    @media (max-width: 720px) {
      .top-summary { grid-template-columns: 1fr 1fr; }
      .chart-controls { flex-direction: column; align-items: flex-start; }
      .chart-container { height: 400px; }
    }
  </style>
</head>

<script>
"use strict";

/**
 * ============================================================================
 * OX CRYPTO SCREENER - CONFIGURATION & THRESHOLDS (集中管理設定)
 * ============================================================================
 */
const CONFIG = {
  apiBase: "https://api.bitget.com/api/v2/mix/market",
  productType: "USDT-FUTURES",
  
  // 流動性與成交額門檻
  liquidity: {
    minUsdtVolume24h: 3_000_000,      // 最低安全 24H 成交額 (3M USDT)
    t1MinUsdtVolume: 15_000_000,      // T1 優先成交額 (15M USDT)
    topPercentileCutoff: 0.65,        // 至少排在全市場成交額前 65%
    lowLiqPenaltyRatio: 0.35,         // 低流動性暴漲懲罰折損比率
  },

  // OX Score 子維度權重配置 (合為 1.0)
  weights: {
    liquidity: 0.30,                  // 資金流動性 30%
    moneyFlow: 0.20,                  // 資金活躍 / 加速度 20%
    structure: 0.20,                  // 價格結構與高低點 20%
    setupMatch: 0.15,                 // Setup 型態契合度 15%
    relativeStrength: 0.10,           // 相對強弱 (vs BTC/ETH) 10%
    momentum: 0.05                    // 短期動量突破 5%
  },

  // T1 / T2 / T3 門檻 (寧缺勿濫，上限 10 顆)
  tiers: {
    t1MinScore: 78,
    t1MinSetupScore: 70,
    t2MinScore: 64,
    t3MinScore: 52,
    maxPerTier: 10
  },

  // 輪詢頻率
  intervals: {
    tickerPollMs: 15000,              // 全市場 Tickers 輪詢頻率 (15s)
    deepScanBatchSize: 8,             // 深度 K 線掃描每次並行數
    deepScanDelayMs: 400              // 防頻率限制延遲
  }
};

/**
 * ============================================================================
 * STATE MANAGEMENT
 * ============================================================================
 */
const state = {
  symbol: "BTCUSDT",
  period: "1D",
  currentTab: "t1",
  
  tickers: [],
  contracts: new Map(),
  allScoredCoins: [],
  tierMap: { t1: [], t2: [], t3: [], surge: [], gainers: [], losers: [] },
  btcTicker: null,
  ethTicker: null,
  
  // Chart objects
  chart: null,
  candleSeries: null,
  volumeSeries: null,
  maSeries: {},
  
  // Chart data cache
  candleData: [],
  isLoadingOlder: false,
  hasMoreHistory: true,
  oldestCandleTime: 0,
  
  // Controllers & Timers
  abortCtrl: null,
  tickerTimer: null,
  isScanning: false,
};

const periods = {
  "1m": 60, "5m": 300, "15m": 900, "1H": 3600, "4H": 14400, "1D": 86400, "1W": 604800
};

const num = v => Number(v) || 0;
const fmtUsd = v => new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 2 }).format(num(v));
const fmtPrice = v => {
  const x = num(v);
  if (!Number.isFinite(x) || x === 0) return "—";
  const d = x >= 1000 ? 2 : x >= 1 ? 4 : x >= 0.01 ? 6 : 8;
  return new Intl.NumberFormat("en-US", { maximumFractionDigits: d }).format(x);
};
const fmtPct = v => `${num(v) >= 0 ? "+" : ""}${(num(v) * 100).toFixed(2)}%`;

/**
 * ============================================================================
 * BITGET API SERVICE (分層調用機制)
 * ============================================================================
 */
const BitgetAPI = {
  // Layer 1: 全市場 Tickers
  async fetchTickers() {
    const res = await fetch(`${CONFIG.apiBase}/tickers?productType=${CONFIG.productType}`, { cache: "no-store" });
    const json = await res.json();
    if (json.code !== "00000" || !Array.isArray(json.data)) throw new Error("Ticker 資料格式錯誤");
    return json.data;
  },

  // 獲取合約基本資訊 (單次緩存)
  async fetchContracts() {
    const res = await fetch(`${CONFIG.apiBase}/contracts?productType=${CONFIG.productType}`, { cache: "no-store" });
    const json = await res.json();
    if (json.code !== "00000" || !Array.isArray(json.data)) return [];
    return json.data.filter(x => x.symbolStatus === "normal" && x.symbolType === "perpetual" && x.quoteCoin === "USDT");
  },

  // 獲取 K 線 (支援 endTime 用於向左 Lazy Load)
  async fetchCandles(symbol, granularity, limit = 100, endTime = null) {
    let url = `${CONFIG.apiBase}/candles?symbol=${symbol}&productType=${CONFIG.productType}&granularity=${granularity}&limit=${limit}`;
    if (endTime) url += `&endTime=${endTime}`;
    const res = await fetch(url, { cache: "no-store" });
    const json = await res.json();
    if (json.code !== "00000" || !Array.isArray(json.data)) return [];
    
    // Bitget API 返回 [ts, open, high, low, close, baseVol, quoteVol]
    return json.data.map(d => ({
      time: Math.floor(num(d[0]) / 1000),
      open: num(d[1]),
      high: num(d[2]),
      low: num(d[3]),
      close: num(d[4]),
      volume: num(d[5]),
      quoteVolume: num(d[6])
    })).sort((a, b) => a.time - b.time);
  }
};

/**
 * ============================================================================
 * ANALYSIS & SETUP DETECTION ENGINE
 * ============================================================================
 */
const OXEngine = {
  // 計算全市場成交額百分位與基礎流動性分
  computeLiquidity(ticker, allTickers) {
    const quoteVol = num(ticker.usdtVolume);
    const sorted = allTickers.map(t => num(t.usdtVolume)).sort((a, b) => b - a);
    const rank = sorted.indexOf(quoteVol);
    const percentile = 1 - (rank / sorted.length); // 0.0 ~ 1.0 (越大越前段)

    let liqScore = percentile * 80;
    if (quoteVol >= CONFIG.liquidity.t1MinUsdtVolume) liqScore += 20;
    else if (quoteVol >= CONFIG.liquidity.minUsdtVolume24h) liqScore += 10;
    
    // 低流動性暴漲懲罰機制：漲幅 > 12% 但成交額在後 40%
    const change = num(ticker.change24h);
    let penaltyApplied = false;
    if (change > 0.12 && percentile < 0.40) {
      liqScore *= CONFIG.liquidity.lowLiqPenaltyRatio;
      penaltyApplied = true;
    }

    return {
      score: Math.min(100, Math.max(0, Math.round(liqScore))),
      percentile: (percentile * 100).toFixed(1),
      quoteVol,
      penaltyApplied
    };
  },

  // 相對強弱評估 (Relative Strength)
  computeRelativeStrength(ticker, btcTicker, ethTicker) {
    const chg = num(ticker.change24h);
    const btcChg = btcTicker ? num(btcTicker.change24h) : 0;
    const ethChg = ethTicker ? num(ethTicker.change24h) : 0;
    
    const diffBtc = chg - btcChg;
    const diffEth = chg - ethChg;
    
    // 超額報酬評分
    let rsScore = 50 + (diffBtc * 200);
    rsScore = Math.min(100, Math.max(0, Math.round(rsScore)));
    
    return {
      score: rsScore,
      diffBtcPct: (diffBtc * 100).toFixed(2),
      isOutperforming: diffBtc > 0.02
    };
  },

  // 快速從 Ticker 與波動度評估資金活躍 (Money Flow)
  computeMoneyFlow(ticker) {
    const high = num(ticker.high24h);
    const low = num(ticker.low24h);
    const last = num(ticker.lastPr);
    const range = high > 0 ? (high - low) / high : 0;
    const posInRange = (high - low) > 0 ? (last - low) / (high - low) : 0.5;

    // 若收在當日高點附近 (承接強) 且成交額具備規模
    let flowScore = 50 + (posInRange * 30) + (num(ticker.change24h) > 0 ? 10 : -10);
    return Math.min(100, Math.max(10, Math.round(flowScore)));
  },

  // 深度 Setup 型態偵測 (支援 Setup A ~ G)
  evaluateSetups(ticker, candles) {
    if (!candles || candles.length < 25) {
      return {
        bestSetup: "觀察蓄勢中",
        setupScore: 50,
        reasons: ["流動性符合基本篩選，等待結構確認"]
      };
    }

    const n = candles.length;
    const last = candles[n - 1];
    const prev = candles[n - 2];
    const highs = candles.map(c => c.high);
    const lows = candles.map(c => c.low);
    const closes = candles.map(c => c.close);
    const vols = candles.map(c => c.volume);

    // 均線與關鍵位
    const ma20 = closes.slice(-20).reduce((a, b) => a + b, 0) / 20;
    const avgVol20 = vols.slice(-20).reduce((a, b) => a + b, 0) / 20;
    const swingHigh20 = Math.max(...highs.slice(-21, -1));
    const swingLow20 = Math.min(...lows.slice(-21, -1));

    const matchedSetups = [];
    const reasons = [];

    // 1. Setup A: 強勢趨勢延續 (Higher High, Higher Low, 價格穩於 MA20 之上)
    const isHigherHigh = last.high >= prev.high && prev.high >= candles[n - 3].high;
    const isHigherLow = last.low >= prev.low && prev.low >= candles[n - 3].low;
    if (last.close > ma20 && isHigherHigh && isHigherLow) {
      matchedSetups.push({ name: "Setup A: 強勢趨勢延續", score: 88 });
      reasons.push("連續 K 線高低點抬高，均線維持多頭順排");
    }

    // 2. Setup B: 關鍵前高突破 (突破 20 根 K 線高點或距離前高 2% 內放量)
    const distToHigh = (swingHigh20 - last.close) / swingHigh20;
    if (last.close >= swingHigh20 && last.volume > avgVol20 * 1.3) {
      matchedSetups.push({ name: "Setup B: 前高放量突破", score: 92 });
      reasons.push(`突破近期關鍵高點 (${fmtPrice(swingHigh20)})，伴隨放量 1.3x+`);
    } else if (distToHigh > 0 && distToHigh < 0.02) {
      matchedSetups.push({ name: "Setup B: 逼近前高蓄勢", score: 75 });
      reasons.push(`距關鍵前高僅 ${(distToHigh * 100).toFixed(1)}%，伺機突破`);
    }

    // 3. Setup C: 波動收斂 / 壓縮待變盤
    const recentRange = (Math.max(...highs.slice(-5)) - Math.min(...lows.slice(-5))) / last.close;
    const priorRange = (Math.max(...highs.slice(-20, -5)) - Math.min(...lows.slice(-20, -5))) / last.close;
    if (recentRange < priorRange * 0.55 && vols.slice(-3).every(v => v < avgVol20)) {
      matchedSetups.push({ name: "Setup C: 壓縮收斂待突破", score: 82 });
      reasons.push("波動率顯著壓縮收緊，量縮至均量之下");
    }

    // 4. Setup E: 底部整理後啟動 (原本低位，近 1~2 根實體大陽 K + 爆量)
    if (last.close > last.open && (last.close - last.open) / last.open > 0.04 && last.volume > avgVol20 * 2.0) {
      matchedSetups.push({ name: "Setup E: 底部放量啟動", score: 86 });
      reasons.push("低位長實體紅 K 起跑，成交量暴增 2.0x+");
    }

    // 5. Setup F: 流動性假跌破收回 (Liquidity Sweep)
    if (last.low < swingLow20 && last.close > swingLow20) {
      matchedSetups.push({ name: "Setup F: 流動性獵取收回", score: 80 });
      reasons.push("跌破前低關鍵支撐後迅速強勢收回");
    }

    if (!matchedSetups.length) {
      matchedSetups.push({ name: "結構震盪中", score: 60 });
      reasons.push("目前處於區間內常態震盪");
    }

    // 選取契合度最高者
    matchedSetups.sort((a, b) => b.score - a.score);
    return {
      bestSetup: matchedSetups[0].name,
      setupScore: matchedSetups[0].score,
      reasons: reasons.slice(0, 3)
    };
  }
};

/**
 * ============================================================================
 * SCREENER ENGINE (全市場分層掃描與 T1/T2/T3 分級)
 * ============================================================================
 */
async function runMarketScan() {
  if (state.isScanning) return;
  state.isScanning = true;
  document.getElementById("scan-status").textContent = "掃描全市場永續合約…";
  document.getElementById("dot").style.background = "#f7bd52";

  try {
    const rawTickers = await BitgetAPI.fetchTickers();
    
    // 初始化合約資訊
    if (!state.contracts.size) {
      const contractList = await BitgetAPI.fetchContracts();
      contractList.forEach(c => state.contracts.set(c.symbol, c));
    }

    // 篩選正常交易之 USDT 永續
    state.tickers = rawTickers.filter(t => 
      state.contracts.has(t.symbol) && 
      [t.lastPr, t.change24h, t.usdtVolume].every(v => Number.isFinite(num(v)))
    );

    // 鎖定基準幣 (BTC / ETH)
    state.btcTicker = state.tickers.find(t => t.symbol === "BTCUSDT") || null;
    state.ethTicker = state.tickers.find(t => t.symbol === "ETHUSDT") || null;

    // 第一階段：全市場流動性初篩與快速打分
    const candidates = [];
    for (const t of state.tickers) {
      const liq = OXEngine.computeLiquidity(t, state.tickers);
      const rs = OXEngine.computeRelativeStrength(t, state.btcTicker, state.ethTicker);
      const flow = OXEngine.computeMoneyFlow(t);

      // 初步安全過濾 (排除極度無流動性的殭屍幣)
      if (liq.quoteVol < CONFIG.liquidity.minUsdtVolume24h && num(t.change24h) < 0.1) {
        continue;
      }

      candidates.push({
        symbol: t.symbol,
        ticker: t,
        liq,
        rs,
        flow
      });
    }

    // 取前 25 顆具備大資金與活躍度的代表幣，進行 Layer 2 深度 K 線型態分析
    candidates.sort((a, b) => (b.liq.score * 0.6 + b.flow * 0.4) - (a.liq.score * 0.6 + a.flow * 0.4));
    const deepBatch = candidates.slice(0, 24);

    const scoredCoins = [];
    for (const item of deepBatch) {
      let candles = [];
      try {
        candles = await BitgetAPI.fetchCandles(item.symbol, "1H", 35);
      } catch (e) {
        // 失敗時略過深度分析，仍保有基礎評分
      }

      const setupRes = OXEngine.evaluateSetups(item.ticker, candles);

      // 綜合 OX Score 計算 (0~100)
      const oxScore = Math.round(
        item.liq.score * CONFIG.weights.liquidity +
        item.flow * CONFIG.weights.moneyFlow +
        setupRes.setupScore * CONFIG.weights.structure +
        setupRes.setupScore * CONFIG.weights.setupMatch +
        item.rs.score * CONFIG.weights.relativeStrength +
        (num(item.ticker.change24h) > 0 ? 5 : 0)
      );

      // 組裝入選原因
      const reasons = [];
      reasons.push(`24H 成交額前 ${100 - item.liq.percentile}% (${fmtUsd(item.liq.quoteVol)} USDT)`);
      if (item.rs.isOutperforming) reasons.push(`強於 BTC +${item.rs.diffBtcPct}%`);
      reasons.push(...setupRes.reasons);
      if (item.liq.penaltyApplied) reasons.push("⚠️ 成交量偏小，暴漲已實施降權防禦");

      scoredCoins.push({
        symbol: item.symbol,
        ticker: item.ticker,
        oxScore,
        liqScore: item.liq.score,
        flowScore: item.flow,
        rsScore: item.rs.score,
        setupScore: setupRes.setupScore,
        setupName: setupRes.bestSetup,
        reasons,
        change24h: num(item.ticker.change24h),
        quoteVol: item.liq.quoteVol
      });
    }

    // 分流至 T1 / T2 / T3 / 異動 / 漲跌榜
    state.allScoredCoins = scoredCoins;
    classifyTiers(scoredCoins, state.tickers);

    renderCurrentTab();
    updateHeaderHUD();
    document.getElementById("scan-status").textContent = `全市場掃描就緒 · ${state.tickers.length} 檔合約`;
    document.getElementById("dot").style.background = "#38c99b";

  } catch (err) {
    document.getElementById("scan-status").textContent = `更新失敗：${err.message}`;
    document.getElementById("dot").style.background = "#ee617c";
  } finally {
    state.isScanning = false;
    clearTimeout(state.tickerTimer);
    state.tickerTimer = setTimeout(runMarketScan, CONFIG.intervals.tickerPollMs);
  }
}

// 分級判斷：嚴格寧缺勿濫，每層上限 10 顆
function classifyTiers(scored, allTickers) {
  const t1 = [];
  const t2 = [];
  const t3 = [];
  const surge = [];

  for (const c of scored) {
    if (c.oxScore >= CONFIG.tiers.t1MinScore && c.liqScore >= 70 && c.setupScore >= CONFIG.tiers.t1MinSetupScore) {
      if (t1.length < CONFIG.tiers.maxPerTier) t1.push(c);
    } else if (c.oxScore >= CONFIG.tiers.t2MinScore && c.liqScore >= 55) {
      if (t2.length < CONFIG.tiers.maxPerTier) t2.push(c);
    } else if (c.oxScore >= CONFIG.tiers.t3MinScore) {
      if (t3.length < CONFIG.tiers.maxPerTier) t3.push(c);
    }

    // 異動榜：放量或價格加速度大
    if (c.change24h > 0.05 && c.flowScore > 75) {
      surge.push(c);
    }
  }

  // 傳統漲跌幅 (標記正負百分比)
  const gainers = allTickers.filter(t => num(t.change24h) > 0)
    .sort((a, b) => num(b.change24h) - num(a.change24h)).slice(0, 15);
  const losers = allTickers.filter(t => num(t.change24h) < 0)
    .sort((a, b) => num(a.change24h) - num(b.change24h)).slice(0, 15);

  state.tierMap = { t1, t2, t3, surge, gainers, losers };

  // 更新 Tab 數字
  document.getElementById("badge-t1").textContent = t1.length;
  document.getElementById("badge-t2").textContent = t2.length;
  document.getElementById("badge-t3").textContent = t3.length;
}

/**

 * SCREENER UI RENDERING

function renderCurrentTab() {
  const container = document.getElementById("screener-list");
  const tab = state.currentTab;

  if (tab === "gainers" || tab === "losers") {
    const list = state.tierMap[tab] || [];
    if (!list.length) {
      container.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted)">暫無資料</div>`;
      return;
    }
    container.innerHTML = list.map((t, idx) => `
      <div class="trad-row ${t.symbol === state.symbol ? 'selected' : ''}" data-symbol="${t.symbol}">
        <span style="color:var(--muted)">${idx + 1}</span>
        <div>
          <b style="font-size:13px">${t.symbol}</b>
          <small style="display:block;color:var(--muted)">${fmtUsd(t.usdtVolume)} USDT</small>
        </div>
        <div style="text-align:right">${fmtPrice(t.lastPr)}</div>
        <div style="text-align:right;font-weight:700" class="${num(t.change24h) >= 0 ? 'positive' : 'negative'}">
          ${fmtPct(t.change24h)}
        </div>
      </div>
    `).join('');
    return;
  }

  // T1 / T2 / T3 / 異動榜
  const list = state.tierMap[tab] || [];
  document.getElementById("pool-count").textContent = `${list.length} 檔標的`;

  if (!list.length) {
    container.innerHTML = `
      <div style="padding:32px 20px;text-align:center;color:var(--muted)">
        <div style="font-size:24px;margin-bottom:8px">⚖️</div>
        <b>符合條件的標的為 0</b>
        <p style="font-size:12px;margin:6px 0 0">嚴格落實寧缺勿濫，目前市場暫無完美符合該等級之結構幣種。</p>
      </div>`;
    return;
  }

  container.innerHTML = list.map((c, idx) => `
    <button class="coin-card ${c.symbol === state.symbol ? 'selected' : ''}" data-symbol="${c.symbol}" type="button">
      <div class="coin-top">
        <span class="coin-title">
          <span style="color:var(--muted);font-size:12px">#${idx + 1}</span>
          <span>${c.symbol}</span>
          <span class="badge badge-${tab === 'surge' ? 'surge' : tab}">
            ${tab.toUpperCase()}
          </span>
        </span>
        <span class="coin-ox">OX ${c.oxScore}</span>
      </div>
      <div class="coin-mid">
        <span class="meta">${fmtPrice(c.ticker.lastPr)}</span>
        <span class="${c.change24h >= 0 ? 'positive' : 'negative'}" style="font-weight:700">
          ${fmtPct(c.change24h)}
        </span>
      </div>
      <div class="coin-reason">
        <b>${c.setupName}</b><br>
        ${c.reasons.join(" · ")}
      </div>
      <div class="score-pills">
        <span class="score-pill">流動性 ${c.liqScore}</span>
        <span class="score-pill">資金活躍 ${c.flowScore}</span>
        <span class="score-pill">型態 ${c.setupScore}</span>
        <span class="score-pill">RS ${c.rsScore}</span>
      </div>
    </button>
  `).join('');
}

/**
 * ============================================================================
 * CHART ENGINE (TradingView Lightweight Charts + Lazy Loading + Histogram)
 * ============================================================================
 */
function initChart() {
  const container = document.getElementById("chart");
  state.chart = LightweightCharts.createChart(container, {
    width: container.clientWidth,
    height: container.clientHeight,
    layout: {
      background: { type: "solid", color: "#090e17" },
      textColor: "#8b9db7"
    },
    grid: {
      vertLines: { color: "#162335" },
      horzLines: { color: "#162335" }
    },
    rightPriceScale: {
      borderColor: "#223147",
      scaleMargins: { top: 0.1, bottom: 0.22 } // 為下方成交量預留空間
    },
    timeScale: {
      borderColor: "#223147",
      timeVisible: true,
      secondsVisible: false
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
  });

  // 主圖：K 線
  state.candleSeries = state.chart.addCandlestickSeries({
    upColor: "#38c99b",
    downColor: "#ee617c",
    borderVisible: false,
    wickUpColor: "#38c99b",
    wickDownColor: "#ee617c"
  });

  // 下方成交量直方圖 (同圖聯動)
  state.volumeSeries = state.chart.addHistogramSeries({
    priceFormat: { type: "volume" },
    priceScaleId: "", // 使用獨立內部刻度疊加
    scaleMargins: { top: 0.8, bottom: 0 }
  });

  // 均線系統
  state.maSeries = {
    5: state.chart.addLineSeries({ color: "#f7bd52", lineWidth: 1.5, lastValueVisible: false }),
    10: state.chart.addLineSeries({ color: "#5ca5ff", lineWidth: 1.5, lastValueVisible: false }),
    20: state.chart.addLineSeries({ color: "#ad7cff", lineWidth: 1.5, lastValueVisible: false })
  };

  // 監聽可視範圍變動，支援向左拖曳 Lazy Load 歷史數據
  state.chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (!range || state.isLoadingOlder || !state.hasMoreHistory) return;
    if (range.from <= 2) {
      loadMoreHistoricalCandles();
    }
  });

  // 視窗自適應縮放
  new ResizeObserver(entries => {
    for (const entry of entries) {
      state.chart.applyOptions({
        width: entry.contentRect.width,
        height: entry.contentRect.height
      });
      updatePriceTimer();
    }
  }).observe(container);
}

// 載入當前幣種 K 線
async function loadSymbolCandles(isInitial = true) {
  state.abortCtrl?.abort();
  state.abortCtrl = new AbortController();
  const overlay = document.getElementById("chart-loading");
  if (isInitial) overlay.classList.add("show");

  try {
    const raw = await BitgetAPI.fetchCandles(state.symbol, state.period, 100);
    if (!raw.length) throw new Error("無可用 K 線");

    state.candleData = raw;
    state.oldestCandleTime = raw[0].time;
    state.hasMoreHistory = true;

    renderChartData(raw, isInitial);
  } catch (err) {
    if (err.name === "AbortError") return;
    console.warn("K線載入失敗:", err.message);
  } finally {
    overlay.classList.remove("show");
  }
}

// 向左拖曳無限分頁加載更舊的歷史 K 線 (Lazy Load)
async function loadMoreHistoricalCandles() {
  if (state.isLoadingOlder || !state.hasMoreHistory) return;
  state.isLoadingOlder = true;
  const overlay = document.getElementById("chart-loading");
  overlay.classList.add("show");

  try {
    const older = await BitgetAPI.fetchCandles(state.symbol, state.period, 100, (state.oldestCandleTime - 1) * 1000);
    if (!older.length) {
      state.hasMoreHistory = false;
      return;
    }

    state.oldestCandleTime = older[0].time;
    const combined = [...older, ...state.candleData].filter((c, i, a) => !i || c.time !== a[i - 1].time);
    state.candleData = combined;

    renderChartData(combined, false);
  } catch (e) {
    console.warn("Lazy load 歷史 K 線中斷");
  } finally {
    state.isLoadingOlder = false;
    overlay.classList.remove("show");
  }
}

// 渲染 K 線、成交量與標記
function renderChartData(candles, fitContent = false) {
  state.candleSeries.setData(candles);

  // 渲染成交量柱體
  const volData = candles.map(c => ({
    time: c.time,
    value: c.volume,
    color: c.close >= c.open ? "#38c99b40" : "#ee617c40"
  }));
  state.volumeSeries.setData(volData);

  // 計算並繪製 MA
  const calcMa = (len) => {
    let sum = 0;
    return candles.map((c, idx) => {
      sum += c.close;
      if (idx >= len) sum -= candles[idx - len].close;
      return idx >= len - 1 ? { time: c.time, value: sum / len } : null;
    }).filter(Boolean);
  };

  [5, 10, 20].forEach(len => {
    state.maSeries[len].setData(calcMa(len));
  });

  // 計算並添加結構標記 (Swing High / Swing Low / OX 訊號)
  if (document.getElementById("chk-ox-markers").checked) {
    const markers = [];
    for (let i = 10; i < candles.length - 1; i++) {
      const c = candles[i];
      // 突破近期高點
      if (c.close > candles[i - 1].high && c.volume > candles[i - 1].volume * 1.8) {
        markers.push({
          time: c.time,
          position: "belowBar",
          color: "#38c99b",
          shape: "arrowUp",
          text: "OX 放量突破"
        });
      }
    }
    state.candleSeries.setMarkers(markers.slice(-6));
  } else {
    state.candleSeries.setMarkers([]);
  }

  if (fitContent) {
    state.chart.timeScale().fitContent();
  }
  updatePriceTimer();
}

function updatePriceTimer() {
  const timerEl = document.getElementById("price-timer");
  if (!state.candleData.length || !timerEl) return;
  const last = state.candleData[state.candleData.length - 1];
  const step = periods[state.period] || 60;
  const now = Math.floor(Date.now() / 1000);
  const left = step - (now % step);
  const m = Math.floor(left / 60);
  const s = left % 60;
  
  const y = state.candleSeries.priceToCoordinate(last.close);
  timerEl.innerHTML = `${fmtPrice(last.close)}<small>倒數 ${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}</small>`;
  if (Number.isFinite(y)) {
    timerEl.style.top = `${Math.max(16, Math.min(document.getElementById("chart").clientHeight - 24, y))}px`;
  }
}

function updateHeaderHUD() {
  const ticker = state.tickers.find(t => t.symbol === state.symbol);
  if (!ticker) return;

  document.getElementById("ticker-pair").textContent = `${ticker.symbol} · Bitget 永續`;
  document.getElementById("price").textContent = fmtPrice(ticker.lastPr);
  
  const chgEl = document.getElementById("change");
  chgEl.textContent = fmtPct(ticker.change24h);
  chgEl.className = num(ticker.change24h) >= 0 ? "positive" : "negative";

  document.getElementById("quote").textContent = `${fmtUsd(ticker.usdtVolume)} USDT`;
  document.getElementById("chart-head-title").children[0].textContent = `${ticker.symbol} 永續合約`;
  document.getElementById("tv-ext-link").href = `https://www.tradingview.com/symbols/${ticker.symbol}.P/?exchange=BITGET`;

  // 尋找已打分的項目
  const scored = state.allScoredCoins.find(c => c.symbol === state.symbol);
  if (scored) {
    document.getElementById("ox-score").textContent = scored.oxScore;
    document.getElementById("ox-tier-label").textContent = `流動分: ${scored.liqScore} · 結構: ${scored.setupScore}`;
    document.getElementById("ox-setup").textContent = scored.setupName;
    document.getElementById("ox-rs-desc").textContent = `RS: ${scored.rsScore} (強弱指標)`;
  } else {
    document.getElementById("ox-score").textContent = "—";
    document.getElementById("ox-tier-label").textContent = "常規觀察池";
    document.getElementById("ox-setup").textContent = "基本走勢";
    document.getElementById("ox-rs-desc").textContent = "—";
  }

  if (state.btcTicker) {
    const diff = num(ticker.change24h) - num(state.btcTicker.change24h);
    document.getElementById("btc-rel").textContent = `相對 BTC: ${diff >= 0 ? '+' : ''}${(diff * 100).toFixed(2)}%`;
  }
}

/**
 * ============================================================================
 * INTERACTION & EVENT LISTENERS
 * ============================================================================
 */
function switchSymbol(symbol) {
  if (symbol === state.symbol) return;
  state.symbol = symbol;
  updateHeaderHUD();
  renderCurrentTab();
  loadSymbolCandles(true);
}

document.addEventListener("click", e => {
  // 切換幣種
  const card = e.target.closest(".coin-card") || e.target.closest(".trad-row");
  if (card && card.dataset.symbol) {
    switchSymbol(card.dataset.symbol);
    return;
  }

  // 篩選池 Tab 切換
  const tabBtn = e.target.closest(".tab-btn");
  if (tabBtn && tabBtn.dataset.tab) {
    state.currentTab = tabBtn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === tabBtn));
    renderCurrentTab();
    return;
  }

  // 時間週期切換
  const tfBtn = e.target.closest(".btn-tf");
  if (tfBtn && tfBtn.dataset.tf) {
    state.period = tfBtn.dataset.tf;
    document.querySelectorAll(".btn-tf").forEach(b => b.classList.toggle("active", b === tfBtn));
    document.getElementById("tf-pill").textContent = `${tfBtn.textContent} ${tfBtn.dataset.tf.includes('D') ? '日線' : tfBtn.dataset.tf.includes('W') ? '週線' : ''}`;
    loadSymbolCandles(true);
    return;
  }

  // 全螢幕切換
  if (e.target.id === "btn-chart-fullscreen") {
    const box = document.querySelector(".chart-box");
    if (!document.fullscreenElement) {
      box.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
    return;
  }

  // 強制重新掃描
  if (e.target.id === "btn-force-rescan") {
    runMarketScan();
    return;
  }
});

// 圖表輔助線 Toggle 開關
document.getElementById("chk-vol").addEventListener("change", e => state.volumeSeries.applyOptions({ visible: e.target.checked }));
document.getElementById("chk-ma5").addEventListener("change", e => state.maSeries[5].applyOptions({ visible: e.target.checked }));
document.getElementById("chk-ma10").addEventListener("change", e => state.maSeries[10].applyOptions({ visible: e.target.checked }));
document.getElementById("chk-ma20").addEventListener("change", e => state.maSeries[20].applyOptions({ visible: e.target.checked }));
document.getElementById("chk-ox-markers").addEventListener("change", () => renderChartData(state.candleData, false));

// 啟動初始化
window.addEventListener("DOMContentLoaded", () => {
  initChart();
  runMarketScan().then(() => loadSymbolCandles(true));
  setInterval(updatePriceTimer, 1000);
});
</script>
