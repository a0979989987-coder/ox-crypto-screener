name: Update TW home close and market briefing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/markets/tw/home-*.js', 'scripts/collect-tw-home.mjs', '.github/workflows/update-tw-home.yml']
  schedule:
    # Daily briefing plus staged weekday close/institutional publication retries.
    - cron: '35 5 * * *'
    - cron: '40 5 * * 1-5'
    - cron: '15 6 * * 1-5'
    - cron: '45 7 * * 1-5'
    - cron: '40 10 * * 1-5'
    - cron: '40 12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tw-home-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/tw-home*.test.mjs
      - run: node scripts/collect-tw-home.mjs
      - name: Save verified source snapshots
        run: |
          git add data/tw-home.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(tw): update home close and market briefing"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
