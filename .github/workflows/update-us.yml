name: Update licensed US market snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * 2-6"
permissions:
  contents: write
concurrency:
  group: us-snapshot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    if: vars.US_DATA_PROVIDER == 'twelve-data' && vars.US_EXTERNAL_DISPLAY_CONFIRMED == 'true' && vars.US_API_CREDITS_PER_MINUTE != '' && vars.US_COLLECT_CREDIT_BUDGET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      US_DATA_PROVIDER: twelve-data
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      US_EXTERNAL_DISPLAY_CONFIRMED: ${{ vars.US_EXTERNAL_DISPLAY_CONFIRMED }}
      US_API_CREDITS_PER_MINUTE: ${{ vars.US_API_CREDITS_PER_MINUTE }}
      US_COLLECT_CREDIT_BUDGET: ${{ vars.US_COLLECT_CREDIT_BUDGET }}
      US_SCAN_TARGET: ${{ vars.US_SCAN_TARGET }}
      US_SCAN_INTERVALS: ${{ vars.US_SCAN_INTERVALS }}
      US_DATA_DELAY_SECONDS: ${{ vars.US_DATA_DELAY_SECONDS }}
      US_FEED_NAME: ${{ vars.US_FEED_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/us2-model.test.mjs tests/us2-service.test.mjs
      - run: node scripts/collect-us.mjs
      - name: Persist verified shared snapshot
        run: |
          git add data/us-directory.json data/us-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(us): refresh licensed shared daily analysis'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
