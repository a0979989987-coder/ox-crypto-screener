name: Verify Taiwan session and shared market UI
on:
  push:
    branches: ['feature/tw-session-3']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tw-session-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-tw-third.cjs
      - run: npm run test:news-v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tw-session-3-browser-qa
          path: |
            /tmp/ox-tw-third-qa
            docs/qa/news-v2
          retention-days: 7
