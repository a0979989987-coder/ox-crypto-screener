name: Verify Taiwan session and shared market UI
on:
  push:
    branches: ['feature/tw-session-3']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tw-session-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Verify live financial news sources
        run: npm run news:collect
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-tw-third.cjs
      - run: npm run test:news-v2
      - if: ${{ !cancelled() }}
        run: node scripts/test-market-ui-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tw-session-3-browser-qa
          path: |
            /tmp/ox-tw-third-qa
            docs/qa/news-v2
            data/news.json
            /tmp/ox-market-ui-audit
          retention-days: 7
