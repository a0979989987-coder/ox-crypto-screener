name: Update verified news snapshot
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ox-news-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run news:collect
      - name: Commit changed source data
        shell: bash
        run: |
          if git diff --quiet -- data/news.json; then exit 0; fi
          git config user.name 'ox-news-bot'
          git config user.email 'ox-news-bot@users.noreply.github.com'
          git add data/news.json
          git commit -m 'data: refresh verified news snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
