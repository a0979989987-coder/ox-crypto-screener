name: Update verified news

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: update-verified-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run news:collect
      - run: node -e "const d=require('./data/news.json'); console.log(JSON.stringify(d.news.filter(x=>x.translationStatus==='pending').map(x=>({id:x.id,sourceId:x.sourceId,title:x.title}))))"
      - run: npm test
      - name: Publish changed snapshot
        run: |
          if git diff --quiet -- data/news.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "data(news): refresh verified source snapshot"
          git push origin HEAD:main
